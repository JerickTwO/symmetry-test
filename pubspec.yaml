name: conectar_flutter_firebase
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.5 <4.0.0"

dependencies:
  firebase_core: 4.4.0
  firebase_analytics: 12.0.0
  firebase_auth: 6.1.4
  cloud_firestore: 6.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_crashlytics: 5.0.5
  flutter_bloc: 9.1.1
  get_it: 9.2.0
  flutter_gen: 5.12.0
  firebase_storage: 13.0.6
  image_picker: 1.2.1
  flutter_markdown: 0.7.7+1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
